name: 2026.10.29_Paper10.1_1e6_PHITS
tool: PHITS
description: Paper 10.1 (PNE 2022) - 8 mẫu thủy tinh S1-S8 (Gd2O3), 23 năng lượng
  (15-15000 keV), PHITS 10^6 primaries, đối chiếu NIST XCOM
primaries: 1000000
runners_per_account: 10
timeout_minutes: 340
max_rescue_rounds: 3
drive:
  parent_folder_id: ''
  root_folder_id: 19DxMwwd0H9qDtrGFgFJJRNWPKuc1Xxhl
github:
  repo: ''
subprojects:
- name: MAC
  samples:
  - S1
  - S2
  - S3
  - S4
  - S5
  - S6
  - S7
  - S8
  thicknesses_cm:
  - 0.005
  - 0.1
  - 0.3
  - 0.5
  - 0.8
  - 1.0
  - 1.5
  - 2.0
  - 2.5
  - 3.0
  energies_kev:
  - 15
  - 20
  - 30
  - 40
  - 50
  - 60
  - 80
  - 100
  - 200
  - 300
  - 400
  - 500
  - 600
  - 800
  - 1000
  - 2000
  - 3000
  - 4000
  - 5000
  - 6000
  - 8000
  - 10000
  - 15000
  jobs_file: jobs.csv
  input_template: '{job}.inp'
run:
  command: $PHITS_BIN < {input}
  parser: phits_track
  parser_options:
    region: 104
    files:
      peak: peak_{job}.out
      total: track_{job}.out
  outputs:
  - '*.out'
  copy_files: []
analysis:
  type: attenuation
  intensity_column: peak_value
  i0:
    mode: blank
    sample: BLANK
  densities_g_cm3:
    S1: 2.39
    S2: 2.725
    S3: 2.908
    S4: 3.103
    S5: 3.836
    S6: 3.909
    S7: 4.181
    S8: 4.411
  theory_csv: theory/mac_theory.csv
